<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root{--ink:#0B0B0F;--ink-2:#1A1A1F;--ink-3:#2A2A2F;--pink:#F286C6;--pink-soft:#F5A8D8;--gold:#EBD687;--silver:#C0C0C6;--cream:#F5F5F5;--ui:'Outfit',system-ui,sans-serif;--serif:'Playfair Display',serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--ink);color:var(--cream);font-family:var(--ui);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 48px;}

  /* Header */
  .site-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:20px 48px;transition:background .3s,border-color .3s,padding .3s;border-bottom:1px solid transparent;}
  .site-header.scrolled{background:rgba(10,7,8,.88);backdrop-filter:blur(16px);border-bottom-color:rgba(242,134,198,.16);padding:13px 48px;}
  .brand{display:flex;align-items:center;text-decoration:none;}
  nav{display:flex;gap:34px;flex:1;justify-content:center;}
  nav a{color:rgba(250,245,243,.72);text-decoration:none;font-size:15px;transition:color .2s;}
  nav a:hover{color:var(--pink);}
  .actions{display:flex;align-items:center;gap:20px;}
  .ic{background:none;border:none;cursor:pointer;display:flex;transition:transform .2s;color:rgba(250,245,243,.6);}
  .ic.cart{color:var(--pink);}
  .ic:hover{transform:scale(1.1);}
  .btn-enter{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--pink);border-radius:999px;padding:7px 18px;font-family:var(--ui);font-weight:600;font-size:13px;color:var(--pink);background:transparent;cursor:pointer;transition:background .2s;}
  .btn-enter:hover{background:rgba(242,134,198,.12);}

  /* Page */
  .page-wrap{padding:120px 0 80px;}
  .profile-layout{display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:start;}

  /* Sidebar */
  .sidebar{background:var(--ink-2);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:32px 24px;position:sticky;top:110px;}
  .avatar-wrap{text-align:center;margin-bottom:24px;}
  .avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--ink-3));border:2px solid rgba(242,134,198,.4);display:flex;align-items:center;justify-content:center;font-family:'Great Vibes',cursive;font-size:36px;color:var(--cream);margin:0 auto 12px;}
  .user-name{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:4px;}
  .user-email{font-size:13px;color:rgba(245,245,245,.45);}
  .member-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(235,214,135,.4);border-radius:999px;padding:5px 12px;margin-top:10px;}
  .sidebar-nav{display:flex;flex-direction:column;gap:4px;margin-top:24px;border-top:1px solid rgba(255,255,255,.07);padding-top:20px;}
  .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;text-decoration:none;font-size:14px;color:rgba(245,245,245,.6);transition:all .2s;}
  .sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(242,134,198,.1);color:var(--pink);}
  .sidebar-nav a.active{font-weight:600;}
  .btn-logout{width:100%;margin-top:24px;background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:10px;font-family:var(--ui);font-size:13px;color:rgba(245,245,245,.45);cursor:pointer;transition:all .2s;}
  .btn-logout:hover{border-color:rgba(242,134,198,.4);color:var(--pink);}

  /* Main Content */
  .main-content h2{font-family:var(--serif);font-size:26px;font-weight:700;margin-bottom:6px;}
  .main-content .section-sub{font-size:14px;color:rgba(245,245,245,.45);margin-bottom:28px;}

  /* Orders */
  .order-card{background:var(--ink-2);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:24px;margin-bottom:16px;transition:border-color .2s;}
  .order-card:hover{border-color:rgba(242,134,198,.25);}
  .order-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .order-num{font-size:13px;font-weight:700;color:var(--cream);letter-spacing:.04em;}
  .order-date{font-size:12px;color:rgba(245,245,245,.4);margin-top:3px;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:999px;padding:5px 14px;}
  .status-pill.entregue{background:rgba(70,200,120,.15);color:#46c878;border:1px solid rgba(70,200,120,.3);}
  .status-pill.transito{background:rgba(235,214,135,.12);color:var(--gold);border:1px solid rgba(235,214,135,.3);}
  .status-pill.processando{background:rgba(242,134,198,.12);color:var(--pink);border:1px solid rgba(242,134,198,.3);}
  .status-pill.pago{background:rgba(70,200,120,.15);color:#46c878;border:1px solid rgba(70,200,120,.25);}
  .status-pill.cancelado{background:rgba(255,80,80,.1);color:#ff6b6b;border:1px solid rgba(255,80,80,.2);}
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .order-items{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .order-item-img{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.08);}
  .order-item-more{width:56px;height:56px;border-radius:10px;background:var(--ink-3);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(245,245,245,.5);}
  .order-footer{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid rgba(255,255,255,.07);flex-wrap:wrap;gap:12px;}
  .order-total{font-size:14px;color:rgba(245,245,245,.5);}
  .order-total strong{color:var(--pink);font-size:16px;}
  .tracking-wrap{background:rgba(242,134,198,.06);border:1px solid rgba(242,134,198,.2);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .tracking-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(245,245,245,.4);margin-bottom:4px;}
  .tracking-code{font-size:15px;font-weight:700;letter-spacing:.08em;color:var(--cream);font-family:monospace;}
  .btn-copy{background:var(--pink);color:#0a0708;border:none;border-radius:999px;padding:8px 18px;font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .2s,transform .2s;white-space:nowrap;}
  .btn-copy:hover{background:var(--pink-soft);transform:scale(1.03);}
  .order-actions{display:flex;gap:10px;}
  .btn-details{background:transparent;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 18px;font-family:var(--ui);font-size:12px;font-weight:600;color:rgba(245,245,245,.6);cursor:pointer;transition:all .2s;}
  .btn-details:hover{border-color:var(--pink);color:var(--pink);}

  /* Stats */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px;}
  .stat-card{background:var(--ink-2);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:20px;text-align:center;}
  .stat-val{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--pink);margin-bottom:4px;}
  .stat-label{font-size:12px;color:rgba(245,245,245,.45);letter-spacing:.06em;}

  /* Footer minimal */
  .site-footer{background:#000;padding:32px 0;border-top:1px solid rgba(242,134,198,.1);text-align:center;}
  .site-footer p{font-size:12.5px;color:rgba(250,245,243,.28);}

  @media(max-width:900px){.profile-layout{grid-template-columns:1fr;}.sidebar{position:static;}.stats-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:560px){.wrap{padding:0 20px;}.stats-grid{grid-template-columns:1fr;}.order-header{flex-direction:column;}}
</style>

<!-- Supabase build-time config (generated by scripts/generate-env-config.js) -->
<script src="/env-config.js"></script>
<!-- Supabase Client JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var hdr = document.getElementById('hdr');
  window.addEventListener('scroll',function(){ hdr.classList.toggle('scrolled',scrollY>40); },{passive:true});

  var supabaseClient = null;

  // Initialize Supabase client from build-time env (no API call needed)
  if (window.__SUPABASE_URL && window.__SUPABASE_ANON_KEY) {
    supabaseClient = supabase.createClient(window.__SUPABASE_URL, window.__SUPABASE_ANON_KEY);
    window.supabaseClient = supabaseClient;

    (async function() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        localStorage.removeItem('ty-user');
        window.location.href = 'login.html';
        return;
      }

      var user = session.user;
      var name = user.user_metadata?.full_name || user.email.split('@')[0];
      var email = user.email;

      localStorage.setItem('ty-user', JSON.stringify({ name: name, email: email }));

      document.getElementById('display-name').textContent = name;
      document.getElementById('display-email').textContent = email;
      document.getElementById('avatar-letter').textContent = name.charAt(0).toUpperCase();

      // Load role and show admin link
      var profile = null;
      try {
        var profileRes = await supabaseClient.from('profiles').select('role').eq('id', user.id).single();
        profile = profileRes.data;
      } catch(e){}
      if (profile && profile.role === 'admin') {
        var adminLink = document.getElementById('admin-nav-link');
        if (adminLink) adminLink.style.display = '';
      }

      // Load real orders
      var ordersRes = await supabaseClient
        .from('orders')
        .select('id, total, status, created_at, order_items(id, quantity, price, products(name, image_url))')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      var orders = (ordersRes.data) || [];
      var totalSpent = orders.reduce(function(s, o){ return s + parseFloat(o.total); }, 0);
      var totalItems = orders.reduce(function(s, o){ return s + o.order_items.reduce(function(si, i){ return si + i.quantity; }, 0); }, 0);

      document.getElementById('stat-orders').textContent = orders.length;
      document.getElementById('stat-total').textContent = 'R$' + totalSpent.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      document.getElementById('stat-items').textContent = totalItems;

      var statusMap = { pending: 'Processando', paid: 'Pago', shipped: 'Em trânsito', cancelled: 'Cancelado' };
      var statusClass = { pending: 'processando', paid: 'pago', shipped: 'transito', cancelled: 'cancelado' };
      var list = document.getElementById('orders-list');

      if (orders.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:48px 0;color:rgba(245,245,245,.3);font-size:14px;">Nenhum pedido ainda. <a href="produtos.html" style="color:var(--pink);text-decoration:none;">Explorar produtos</a></div>';
      } else {
        list.innerHTML = orders.map(function(order, idx) {
          var d = new Date(order.created_at);
          var dateStr = d.toLocaleDateString('pt-BR', {day:'2-digit',month:'long',year:'numeric'}) + ' · ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
          var imgs = order.order_items.slice(0,3).map(function(item) {
            var img = (item.products && item.products.image_url) ? item.products.image_url : 'assets/produto-bong-cylinder.jpeg';
            var alt = (item.products && item.products.name) ? item.products.name : 'Produto';
            return '<img class="order-item-img" src="'+img+'" alt="'+alt+'">';
          }).join('');
          var itemCount = order.order_items.reduce(function(s,i){return s+i.quantity;},0);
          var st = order.status || 'pending';
          var pill = statusClass[st] || 'processando';
          var label = statusMap[st] || st;
          return '<div class="order-card">'+
            '<div class="order-header">'+
              '<div>'+
                '<div class="order-num">#TYN-'+d.getFullYear()+'-'+String(idx+1).padStart(4,'0')+'</div>'+
                '<div class="order-date">'+dateStr+'</div>'+
              '</div>'+
              '<span class="status-pill '+pill+'"><span class="dot"></span> '+label+'</span>'+
            '</div>'+
            '<div class="order-items">'+imgs+'</div>'+
            '<div class="order-footer">'+
              '<span class="order-total">'+itemCount+' item(s) · Total: <strong>R$ '+parseFloat(order.total).toFixed(2).replace('.',',')+'</strong></span>'+
              '<div class="order-actions"><button class="btn-details">Ver detalhes</button></div>'+
            '</div>'+
          '</div>';
        }).join('');
      }

      supabaseClient.auth.onAuthStateChange(function(event, currentSession) {
        if (event === 'SIGNED_OUT') {
          localStorage.removeItem('ty-user');
          window.location.href = 'login.html';
        }
      });
    })();
  } else {
    var localUser = JSON.parse(localStorage.getItem('ty-user')||'{}');
    if (!localUser.email) { window.location.href = 'login.html'; }
  }

})();

window.copyCode = function(id, btn){
  var code = document.getElementById(id).textContent;
  navigator.clipboard.writeText(code).catch(function(){});
  btn.textContent = '✓ Copiado!';
  btn.style.background = 'var(--gold)';
  setTimeout(function(){ btn.textContent = 'Copiar'; btn.style.background = ''; },1800);
};

window.logout = async function(){
  localStorage.removeItem('ty-user');
  if (window.supabaseClient) {
    await window.supabaseClient.auth.signOut();
  } else {
    // If not loaded/fallback
    window.location.href = 'login.html';
  }
};
</script>
</body>
