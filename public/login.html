<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root{--ink:#0B0B0F;--ink-2:#1A1A1F;--ink-3:#2A2A2F;--pink:#F286C6;--pink-soft:#F5A8D8;--gold:#EBD687;--cream:#F5F5F5;--ui:'Outfit',system-ui,sans-serif;--serif:'Playfair Display',serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:var(--cream);font-family:var(--ui);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

  /* ---- Left Panel ---- */
  .left-panel{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 48px;overflow:hidden;background:#000;}
  .left-panel .glow{position:absolute;inset:0;background:radial-gradient(55% 55% at 50% 50%,rgba(120,18,66,.45) 0%,rgba(0,0,0,0) 70%);pointer-events:none;}
  .left-panel .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent 80%);mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent 80%);}
  .left-panel .content{position:relative;z-index:2;text-align:center;}
  .left-panel .logo{width:440px;max-width:100%;height:auto;margin-bottom:8px;filter:drop-shadow(0 0 30px rgba(242,134,198,.3));}
  .left-panel h2{font-family:'Great Vibes',cursive;font-size:52px;color:var(--cream);line-height:1.1;margin-bottom:8px;}
  .left-panel p{font-size:14px;color:rgba(245,245,245,.5);line-height:1.8;max-width:320px;}
  /* ---- Smoke Canvas ---- */
  .smoke-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
  .stars{position:absolute;pointer-events:none;z-index:1;}
  .star:nth-child(2){animation-delay:1.4s;top:18%;left:12%;}
  .star:nth-child(3){animation-delay:2.8s;top:72%;right:14%;}
  .star:nth-child(4){animation-delay:.8s;top:30%;right:18%;}
  .star:nth-child(5){animation-delay:2s;top:65%;left:16%;}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.8);}50%{opacity:.9;transform:scale(1.1);}}

  /* ---- Right Panel ---- */
  .right-panel{width:520px;display:flex;flex-direction:column;justify-content:center;padding:60px 56px;background:var(--ink-2);border-left:1px solid rgba(242,134,198,.1);}
  .back-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:rgba(245,245,245,.45);text-decoration:none;margin-bottom:48px;transition:color .2s;}
  .back-link:hover{color:var(--pink);}
  .form-title{font-family:var(--serif);font-size:32px;font-weight:700;margin-bottom:6px;}
  .form-sub{font-size:14px;color:rgba(245,245,245,.45);margin-bottom:40px;}
  .tabs{display:flex;gap:0;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px;margin-bottom:36px;background:rgba(255,255,255,.03);}
  .tab{flex:1;padding:9px;border-radius:999px;border:none;background:transparent;font-family:var(--ui);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:rgba(245,245,245,.45);}
  .tab.active{background:var(--pink);color:#0a0708;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,245,245,.5);margin-bottom:8px;}
  .field input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 18px;font-family:var(--ui);font-size:15px;color:var(--cream);outline:none;transition:border-color .2s;}
  .field input:focus{border-color:rgba(242,134,198,.6);}
  .field input::placeholder{color:rgba(245,245,245,.3);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .forgot{display:flex;justify-content:flex-end;margin-bottom:24px;}
  .forgot a{font-size:12px;color:rgba(245,245,245,.4);text-decoration:none;transition:color .2s;}
  .forgot a:hover{color:var(--pink);}
  .btn-submit{width:100%;background:var(--pink);color:#0a0708;border:none;border-radius:999px;padding:16px;font-family:var(--ui);font-weight:800;font-size:15px;letter-spacing:.08em;cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s;margin-bottom:28px;}
  .btn-submit:hover{background:var(--pink-soft);transform:scale(1.02);box-shadow:0 0 30px rgba(242,134,198,.4);}
  .divider{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .divider span{font-size:12px;color:rgba(245,245,245,.3);}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}
  .social-btns{display:flex;gap:12px;margin-bottom:32px;}
  .btn-social{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px;font-family:var(--ui);font-size:13px;font-weight:600;color:rgba(245,245,245,.7);cursor:pointer;transition:all .2s;}
  .btn-social:hover{border-color:rgba(242,134,198,.4);color:var(--pink);}
  .form-footer{font-size:13px;color:rgba(245,245,245,.4);text-align:center;}
  .form-footer a{color:var(--pink);text-decoration:none;}
  .register-only{display:none;}
  .consent-label{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:13px;color:rgba(245,245,245,.6);text-transform:none;letter-spacing:0;font-weight:400;cursor:pointer;line-height:1.5;}
  .consent-label input[type="checkbox"]{flex-shrink:0;width:16px;height:16px;accent-color:var(--pink);cursor:pointer;margin:0;}
  .consent-label a{color:var(--pink);}
  @media(max-width:900px){body{flex-direction:column;}.left-panel{min-height:240px;flex:none;padding:40px 24px;}.right-panel{width:100%;padding:40px 28px;}}

  /* ---- Toast System ---- */
  .ty-toast-wrap{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
  .ty-toast{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;background:rgba(15,15,20,.96);border-radius:16px;max-width:340px;pointer-events:all;transform:translateX(130%);transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s;opacity:0;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5);}
  .ty-toast.show{transform:translateX(0);opacity:1;}
  .ty-toast.hide{transform:translateX(130%);opacity:0;}
  .ty-toast-success{border:1px solid rgba(70,200,120,.3);box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(70,200,120,.1);}
  .ty-toast-error{border:1px solid rgba(242,100,100,.3);box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(242,100,100,.1);}
  .ty-toast-info{border:1px solid rgba(242,134,198,.3);box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(242,134,198,.1);}
  .ty-toast-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:1px;}
  .ty-toast-success .ty-toast-icon{background:rgba(70,200,120,.2);color:#46c878;}
  .ty-toast-error .ty-toast-icon{background:rgba(242,100,100,.2);color:#f26464;}
  .ty-toast-info .ty-toast-icon{background:rgba(242,134,198,.2);color:#F286C6;}
  .ty-toast-body{flex:1;}
  .ty-toast-msg{font-family:'Outfit',system-ui,sans-serif;font-size:13px;font-weight:500;color:rgba(245,245,245,.9);line-height:1.5;}
  .ty-toast-bar{position:absolute;bottom:0;left:0;height:2px;width:100%;transform-origin:left;}
  .ty-toast-success .ty-toast-bar{background:rgba(70,200,120,.6);}
  .ty-toast-error .ty-toast-bar{background:rgba(242,100,100,.6);}
  .ty-toast-info .ty-toast-bar{background:rgba(242,134,198,.6);}
  @keyframes ty-shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
</style>

<!-- Supabase Client JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var currentTab = 'login';
var supabaseClient = null;

// Initialize Supabase client from build-time env (no API call needed)
if (window.__SUPABASE_URL && window.__SUPABASE_ANON_KEY) {
  supabaseClient = supabase.createClient(window.__SUPABASE_URL, window.__SUPABASE_ANON_KEY);

  // Configure Google OAuth login
  document.getElementById('btn-google').addEventListener('click', async function(e) {
    e.preventDefault();
    const { data, error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/perfil.html'
      }
    });
    if (error) {
      showToast('Erro Google: ' + error.message,'error');
    }
  });
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.querySelectorAll('.register-only').forEach(function(el){ el.style.display = tab === 'register' ? (el.classList.contains('field-row') ? 'grid' : 'block') : 'none'; });
  document.getElementById('forgot-row').style.display = tab === 'login' ? 'flex' : 'none';
  document.getElementById('submit-btn').textContent = tab === 'login' ? 'ENTRAR' : 'CRIAR CONTA';
  document.getElementById('form-footer').innerHTML = tab === 'login'
    ? 'Não tem conta? <a href="#" onclick="switchTab(\'register\');return false;">Junte-se a nós</a>'
    : 'Já tem conta? <a href="#" onclick="switchTab(\'login\');return false;">Entrar</a>';
}

function sanitizeAuthError(msg) {
  if (!msg) return 'Erro desconhecido. Tente novamente.';
  if (msg.toLowerCase().includes('invalid login credentials') || msg.toLowerCase().includes('invalid email or password')) return 'Email ou senha incorretos.';
  if (msg.toLowerCase().includes('email not confirmed')) return 'Confirme seu e-mail antes de entrar.';
  if (msg.toLowerCase().includes('too many requests')) return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if (msg.toLowerCase().includes('user already registered')) return 'Este e-mail já está cadastrado. Tente fazer login.';
  if (msg.toLowerCase().includes('password should be')) return 'A senha deve ter pelo menos 6 caracteres.';
  return 'Erro de autenticação. Tente novamente.';
}

async function handleSubmit(e){
  e.preventDefault();

  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  if (!supabaseClient) {
    showToast('Conexão com Supabase não inicializada.','error');
    return;
  }

  var btn = document.getElementById('submit-btn');
  btn.textContent = currentTab === 'login' ? 'Entrando...' : 'Criando conta...';
  btn.style.opacity = '.7';

  if (currentTab === 'login') {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      showToast(sanitizeAuthError(error.message),'error');
      btn.textContent = 'ENTRAR';
      btn.style.opacity = '1';
    } else {
      var user = {
        name: data.user.user_metadata?.full_name || data.user.email.split('@')[0],
        email: data.user.email
      };
      localStorage.setItem('ty-user', JSON.stringify(user));
      window.location.href = 'perfil.html';
    }
  } else {
    var confirmPass = document.getElementById('confirm').value;
    if (password !== confirmPass) {
      showToast('As senhas não coincidem.','error');
      btn.textContent = 'CRIAR CONTA';
      btn.style.opacity = '1';
      return;
    }

    var consentCheck = document.getElementById('consent-check');
    if (!consentCheck.checked) {
      showToast('Aceite os Termos de Uso para continuar.','error');
      btn.textContent = 'CRIAR CONTA';
      btn.style.opacity = '1';
      return;
    }

    var fname = document.getElementById('fname').value.trim() || 'Cliente';
    var lname = document.getElementById('lname').value.trim() || '';
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: (fname + ' ' + lname).trim(),
          terms_accepted: true,
          consented_at: new Date().toISOString(),
          privacy_policy_version: '1.0'
        }
      }
    });

    if (error) {
      showToast(sanitizeAuthError(error.message),'error');
      btn.textContent = 'CRIAR CONTA';
      btn.style.opacity = '1';
    } else {
      showToast('Cadastro realizado! Verifique seu e-mail.','success');
      var user = {
        name: (fname + ' ' + lname).trim(),
        email: email
      };
      localStorage.setItem('ty-user', JSON.stringify(user));
      window.location.href = 'perfil.html';
    }
  }
}

function showForgotPassword(){
  document.getElementById('forgot-modal').style.display='block';
  document.getElementById('reset-email').value = document.getElementById('email').value || '';
  document.getElementById('reset-email').focus();
}
function hideForgotPassword(){
  document.getElementById('forgot-modal').style.display='none';
}
async function sendPasswordReset(){
  if(!supabaseClient){ showToast('Conexão com Supabase não inicializada.','error'); return; }
  var email = document.getElementById('reset-email').value.trim();
  if(!email){ showToast('Informe um e-mail válido.','error'); return; }
  var btn = document.querySelector('#forgot-modal button');
  btn.textContent='Enviando...'; btn.style.opacity='.7';
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/login.html'
  });
  btn.textContent='Enviar link'; btn.style.opacity='1';
  if(error){ showToast('Erro: ' + error.message,'error'); }
  else { showToast('Link enviado! Verifique seu e-mail.','success'); hideForgotPassword(); }
}

function showToast(msg, type){
  type = type || 'info';
  var icons = {success:'✓', error:'✕', info:'i'};
  var wrap = document.getElementById('ty-toasts');
  var t = document.createElement('div');
  t.className = 'ty-toast ty-toast-'+type;
  t.innerHTML = '<div class="ty-toast-icon">'+icons[type]+'</div><div class="ty-toast-body"><div class="ty-toast-msg">'+msg+'</div></div><div class="ty-toast-bar" style="animation:ty-shrink 3.5s linear forwards"></div>';
  wrap.appendChild(t);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ t.classList.add('show'); }); });
  setTimeout(function(){ t.classList.add('hide'); setTimeout(function(){ t.remove(); }, 400); }, 3500);
}
</script>
<script>
(function(){
  var canvas = document.getElementById('smoke');
  var ctx = canvas.getContext('2d');
  var W, H, particles = [];

  function resize(){
    var rect = canvas.parentElement.getBoundingClientRect();
    W = canvas.width = rect.width;
    H = canvas.height = rect.height;
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);

  function Particle(){
    this.reset();
  }
  Particle.prototype.reset = function(){
    this.x = W * (.1 + Math.random() * .8);
    this.y = H + 40;
    this.vx = (Math.random() - .5) * .9;
    this.vy = -(Math.random() * 2.2 + 1.2);
    this.r = Math.random() * 80 + 40;
    this.maxR = this.r + Math.random() * 60 + 40;
    this.life = 0;
    this.maxLife = Math.floor((H + this.r) / Math.abs(this.vy)) + 20;
    var hues = ['242,134,198','235,214,135','245,168,216','200,100,170','255,160,220'];
    this.color = hues[Math.floor(Math.random()*hues.length)];
  };
  Particle.prototype.update = function(){
    this.x += this.vx + Math.sin(this.life * .025) * .7;
    this.y += this.vy;
    if(this.r < this.maxR) this.r += .5;
    this.life++;
    var p = this.life / this.maxLife;
    var fadeIn = Math.min(1, p / .15);
    var fadeOut = p > .75 ? 1 - (p - .75) / .25 : 1;
    this.alpha = fadeIn * fadeOut * (.20 + Math.random() * .06);
    if(this.y + this.r < -20 || this.life >= this.maxLife) this.reset();
  };
  Particle.prototype.draw = function(){
    if (W <= 0 || H <= 0) return;
    var g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    g.addColorStop(0, 'rgba('+this.color+','+this.alpha.toFixed(3)+')');
    g.addColorStop(1, 'rgba('+this.color+',0)');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();
  };

  for(var i = 0; i < 40; i++){
    var p = new Particle();
    p.life = Math.floor(Math.random() * p.maxLife);
    particles.push(p);
  }

  function frame(){
    var rect = canvas.parentElement.getBoundingClientRect();
    if (W !== rect.width || H !== rect.height) {
      resize();
    }
    ctx.clearRect(0, 0, W, H);
    particles.forEach(function(p){ p.update(); p.draw(); });
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
<div class="ty-toast-wrap" id="ty-toasts"></div>
</body>
</html>
