<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha — ANIT</title>
<style>body{background:#111;color:#eee;font:16px system-ui;margin:0;padding:24px}main{max-width:420px;margin:10vh auto}label,input,button{display:block;width:100%;box-sizing:border-box;margin:16px 0}input,button{padding:14px;border-radius:6px}a{color:#cbe7ab}</style></head>
<body><main><h1>Definir nova senha</h1><p>Abra o link enviado ao seu e-mail para alterar a senha.</p><form id="form"><label>Nova senha<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirme a senha<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button id="save" disabled>Salvar senha</button></form><p id="message" role="status" aria-live="polite">Validando o link…</p><a href="login.html">Voltar ao login</a></main>
<script src="/env-config.js"></script><script src="/auth-client.js"></script><script>
const client = supabase.createClient(window.__SUPABASE_URL, window.__SUPABASE_ANON_KEY);
const message = document.getElementById('message'), save = document.getElementById('save');
client.auth.getUser().then(({data,error}) => {
  save.disabled = !!error || !data.user;
  message.textContent = save.disabled ? 'Link inválido ou expirado. Solicite outro link no login.' : 'Informe sua nova senha.';
}).catch(() => {message.textContent = 'Não foi possível validar o link. Tente novamente.';});
document.getElementById('form').onsubmit = async event => {
  event.preventDefault();
  const password = document.getElementById('password').value;
  if (password !== document.getElementById('confirm').value) {message.textContent = 'As senhas não coincidem.'; return;}
  save.disabled = true;
  try {
    const {error} = await client.auth.updateUser({password});
    if (error) {message.textContent = 'Não foi possível atualizar a senha. Verifique os requisitos e tente novamente.'; save.disabled = false; return;}
    await client.auth.signOut();
    message.textContent = 'Senha atualizada! Entre novamente com sua nova senha.';
  } catch {message.textContent = 'Falha na conexão. Tente novamente.'; save.disabled = false;}
};
</script></body></html>
