name: ANIT quality checks
on:
  pull_request:
    branches: [main, chore/fase-1-fundacao-anit]
  push:
    branches: [feat/fase-2-pagamentos]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint changed payment modules
        run: npx eslint src/lib/mercadopago-webhook.ts src/app/api/webhooks/mercadopago/route.ts src/app/api/payments/mercadopago/route.ts
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
