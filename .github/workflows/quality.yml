name: ANIT quality checks
on:
  pull_request:
    branches: [main, chore/fase-1-fundacao-anit]
  push:
    branches: [feat/fase-2-pagamentos, chore/fase-6-qa-release, fix/consolidacao-main-anit, fix/qa-playwright-lint]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full repository lint
        run: npm run lint
      - name: Payment webhook signature regression
        run: node scripts/test-mercadopago-signature.cjs
      - name: SQL payment reconciliation regression
        run: node scripts/test-payment-reconciliation.cjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Check JavaScript syntax
        run: |
          node --check public/checkout.js
          node --check public/pedidos.js
          node --check public/anit.js
          node --check scripts/test-pix.cjs
      - name: Production build
        run: npm run build
      - name: Install Playwright for browser QA
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start application for browser smoke
        run: |
          (npm run start > /tmp/anit-next.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3000/store.html >/dev/null && break; sleep 2; done
          curl -f http://127.0.0.1:3000/store.html >/dev/null
      - name: End-to-end Chromium smoke
        run: node scripts/test-playwright-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anit-browser-screenshots
          path: test-results/anit
          if-no-files-found: ignore
